<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify CD Jewel Case 3D Interactive Player</title>
  <meta name="description" content="Interactive 3D CD Jewel Case music player with authentic plastic sheen, physical edge thickness, and angle-dependent holographic highlights.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <!-- Ambient Atmosphere Glow -->
  <div class="ambient-glow">
    <div class="ambient-blob-1"></div>
    <div class="ambient-blob-2"></div>
  </div>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.508 17.302c-.216.353-.674.466-1.026.25-2.813-1.718-6.353-2.106-10.523-1.154-.403.092-.806-.157-.898-.56-.092-.402.157-.805.56-.897 4.568-1.044 8.49-.607 11.636 1.335.353.216.466.674.251 1.026zm1.47-3.266c-.272.443-.852.583-1.295.31-3.22-1.979-8.129-2.55-11.938-1.393-.497.151-1.027-.132-1.178-.63-.151-.497.132-1.027.63-1.178 4.354-1.321 9.774-.68 13.47 1.595.443.272.584.852.311 1.296zm.126-3.41c-3.86-2.292-10.228-2.503-13.908-1.385-.592.18-1.217-.16-1.396-.753-.18-.592.16-1.217.753-1.396 4.234-1.285 11.266-1.037 15.698 1.594.532.316.708 1.005.392 1.537-.315.533-1.004.709-1.539.403z"/>
        </svg>
      </div>
      <h1 class="brand-title">Spotify Jewel Case 3D</h1>
    </div>
    <div class="header-actions">
      <!-- Spotify Album Search -->
      <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="spotify-search-input" placeholder="Search Spotify albums..." autocomplete="off">
        <div id="search-dropdown" class="search-dropdown" style="display: none;"></div>
      </div>

      <!-- Spotify Connect Button / User Badge -->
      <button id="btn-spotify-login" class="spotify-auth-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.508 17.302c-.216.353-.674.466-1.026.25-2.813-1.718-6.353-2.106-10.523-1.154-.403.092-.806-.157-.898-.56-.092-.402.157-.805.56-.897 4.568-1.044 8.49-.607 11.636 1.335.353.216.466.674.251 1.026zm1.47-3.266c-.272.443-.852.583-1.295.31-3.22-1.979-8.129-2.55-11.938-1.393-.497.151-1.027-.132-1.178-.63-.151-.497.132-1.027.63-1.178 4.354-1.321 9.774-.68 13.47 1.595.443.272.584.852.311 1.296zm.126-3.41c-3.86-2.292-10.228-2.503-13.908-1.385-.592.18-1.217-.16-1.396-.753-.18-.592.16-1.217.753-1.396 4.234-1.285 11.266-1.037 15.698 1.594.532.316.708 1.005.392 1.537-.315.533-1.004.709-1.539.403z"/>
        </svg>
        <span id="spotify-auth-text">Connect Spotify</span>
      </button>
    </div>
  </header>


  <main>
    <!-- 3D Interactive Viewport -->
    <div class="viewport-container" id="viewport-container">
      <canvas id="canvas3d"></canvas>

      <!-- Carousel Thumbnail Strip -->
      <div class="album-bar" id="album-bar">
        <button class="album-thumb-btn active" id="thumb-snatch" title="Snatch Soundtrack">
          <img src="public/covers/snatch.png" alt="Snatch OST">
        </button>
        <button class="album-thumb-btn" id="thumb-stayin" title="Stayin Alive in da Club">
          <img src="public/covers/stayin_alive.png" alt="Stayin Alive in da Club">
        </button>
        <label class="upload-btn" id="btn-upload" title="Upload custom album art">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Add</span>
        </label>
        <input type="file" id="cover-file-input" accept="image/*" style="display:none">
      </div>

      <!-- Interaction Hint -->
      <div class="interaction-hint">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M8 12h8"></path>
          <path d="M12 8l4 4-4 4"></path>
        </svg>
        <span id="hint-text">Click case to open / close • Drag to rotate in 3D</span>
      </div>

    </div>

    <!-- Inspector / Audio Sidebar -->
    <aside class="sidebar">
      <!-- Current Album Info -->
      <div class="panel-section">
        <span class="panel-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
          Now Selected
        </span>
        <div class="track-card">
          <img id="track-cover-mini" class="track-cover-mini" src="public/covers/snatch.png" alt="Mini cover">
          <div class="track-details">
            <div id="track-title" class="track-title">Snatch Soundtrack</div>
            <div id="track-artist" class="track-artist">Various Artists</div>
            <div id="track-badge" class="track-badge">15 Tracks • 2000</div>
          </div>
        </div>
      </div>

      <!-- Audio Player Control -->
      <div class="panel-section">
        <span class="panel-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          Audio Preview
        </span>
        <div class="audio-player-box">
          <div style="font-size: 0.8125rem; font-weight: 500;" id="now-playing-sample">Diamond - Klint</div>
          <div class="progress-bar-container">
            <div class="progress-track" id="progress-track">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="time-row">
              <span id="time-current">1:12</span>
              <span>3:35</span>
            </div>
          </div>
          <div class="player-controls">
            <button class="ctrl-btn" id="btn-prev" title="Previous Track">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"/></svg>
            </button>
            <button class="ctrl-btn ctrl-play" id="btn-play" title="Play / Pause">
              <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              <svg id="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            </button>
            <button class="ctrl-btn" id="btn-next" title="Next Track">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/></svg>
            </button>
          </div>
        </div>
      </div>
    </aside>

  </main>

  <!-- Module Script -->
  <script type="module" src="main.js?v=2"></script>
</body>

</html>
